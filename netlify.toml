# Sito statico. Queste impostazioni hanno la precedenza su quelle dell'interfaccia di Netlify
# (utile perché il sito in passato ospitava un progetto Next.js con impostazioni diverse).
# La build compila i file .ink in story/ (le storie compilate sono comunque già nel repository).
[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Il sito ospitava un'app Next.js: il plugin Next.js di Netlify è rimasto attivo
  # e cerca la cartella .next, che qui non esiste. Questo lo disattiva.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/story/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/art/*"
  [headers.values]
    Cache-Control = "public, max-age=600"
